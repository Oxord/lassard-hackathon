<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Лассард: шоурум, 3D</title>
<style>
  html,body{margin:0;height:100%;background:#f4f4f4;font-family:system-ui,sans-serif;color:#262626;overflow:hidden}
  #app{position:fixed;inset:0}
  #controls{position:fixed;top:12px;left:12px;right:352px;display:flex;flex-direction:column;gap:8px;max-height:45vh;overflow:auto;z-index:2}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  button{background:#dd191c;color:#fff;border:0;border-radius:6px;padding:8px 12px;font-size:14px;cursor:pointer}
  button.alt{background:#7f7f7f} button.on{background:#262626;color:#fff}
  #card{position:fixed;right:12px;top:12px;width:300px;max-width:calc(100% - 24px);background:#fff;color:#262626;border:1px solid #bbb;border-radius:10px;padding:14px;display:none;z-index:2}
  #card h3{margin:0 0 6px} #card small{color:#666}
  #caption{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:rgba(255,255,255,.92);border:1px solid #bbb;padding:14px 22px;border-radius:10px;font-size:22px;display:none;z-index:2;max-width:80%;text-align:center}
  #caption b{color:#dd191c}
  #legend{position:fixed;right:12px;bottom:12px;background:rgba(255,255,255,.92);border:1px solid #bbb;border-radius:8px;padding:8px 12px;font-size:12px;z-index:2}
  #legend i{display:inline-block;width:26px;height:0;vertical-align:middle;margin-right:6px}
  #hint{position:fixed;left:12px;bottom:12px;font-size:12px;color:#595959;z-index:2}
  @media(max-width:760px){
    #controls{right:12px}
    #card{top:50%;bottom:auto;max-height:calc(50vh - 68px);overflow:auto;box-sizing:border-box;width:328px}
    #hint{right:12px}
    #caption{font-size:16px;padding:10px 14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="controls">
<div class="bar" id="bar-top">
  <button id="btn-orbit">Облёт</button>
  <button id="btn-top" class="alt">Вид сверху</button>
  <button id="btn-walk" class="alt">Прогулка</button>
  <button id="btn-tour" class="alt">Автотур</button>
  <button id="btn-route" class="alt">Маршрут</button>
</div>
<div class="bar" id="bar-scn"></div>
</div>
<div id="card"></div>
<div id="caption"></div>
<div id="legend"><div><i style="border-top:5px solid #dd191c"></i>Луч ЛАССАРД: основной маршрут</div><div><i style="border-top:2px dashed #7f7f7f"></i>Маршрут выбранной роли</div></div>
<div id="hint">Клик по зоне: карточка. Прогулка: WASD или стрелки, мышь с зажатой кнопкой: поворот.</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
